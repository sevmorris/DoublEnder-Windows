name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow builds with exactly these jobs.
  workflow_call:

# A new push to a pull request cancels the run for the commit before it, which
# nobody would read. Every other run has a group of its own, by run_id, so each
# push to the default branch is tested to the end. When release.yml calls this
# workflow, the workflow name and run_id are the release run's, so its group is
# its own too. repo-standards holds every workflow to this (ci-cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Builds and tests the package, and packages a release for each OS as an
  # artifact. The Mac app lives in sevmorris/DoublEnder with its own CI.
  linux:
    runs-on: ubuntu-24.04
    # Building on 24.04 sets the oldest glibc the static binary runs on.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install X11 headers and ffmpeg
        # GLFW compiles against the X11 headers but loads the libraries at
        # runtime; ffmpeg lets the AAC test run.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            ffmpeg binutils

      - name: Test
        run: swift test

      - name: Package
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: DoublEnder-linux
          path: dist/*.tar.gz

  # The ffmpeg.exe the Windows package ships for AAC: minimal and LGPL, built
  # from the source pinned in Vendor/ffmpeg-manifest.env by our own recipe.
  # Cached, so it rebuilds only when the recipe or the pin changes.
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - id: cache
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg-windows.sh', 'Vendor/ffmpeg-manifest.env') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm
          scripts/build-ffmpeg-windows.sh build/ffmpeg-windows

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          path: build/ffmpeg-windows
          if-no-files-found: error

  windows:
    needs: ffmpeg-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: build/ffmpeg-windows

      # Pinned to a commit (v0.5.0): a third-party action runs with the
      # job's token, so a moved tag or branch can't change what runs.
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057  # v0.5.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Test
        # With the shipped ffmpeg.exe first on PATH, the AAC test encodes
        # through it, on Windows, as a guest's take would be.
        shell: pwsh
        run: |
          $env:PATH = "$((Resolve-Path build\ffmpeg-windows).Path);$env:PATH"
          swift test

      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1 -Ffmpeg build\ffmpeg-windows\ffmpeg.exe

      - name: Install, check and uninstall
        # As a guest would get it: per user, with no administrator, every
        # file in place and ffmpeg.exe working; then the uninstaller takes
        # it all away again. DoublEnder.exe itself can't run here (no
        # OpenGL 3.3 on the runner).
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\DoublEnder"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{0D27D1E9-E677-4B5C-B9B4-4B9775F742D6}_is1'
          $setup = Start-Process dist\DoublEnder-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup exited $($setup.ExitCode)" }
          foreach ($file in 'DoublEnder.exe', 'ffmpeg.exe', 'swiftCore.dll', 'vcruntime140.dll', 'DoublEnder.ico',
                            'Resources\Images\faceplate.png', 'licenses\ffmpeg-LICENSE.txt', 'unins000.exe') {
            if (-not (Test-Path "$dir\$file")) { throw "Not installed: $file" }
          }
          $version = (Get-ItemProperty $key).DisplayVersion
          Write-Host "Installed per user: DoublEnder $version in $dir"
          # All of its output first: cutting the pipe short fails its writes.
          $ffmpegVersion = & "$dir\ffmpeg.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "The installed ffmpeg.exe didn't run" }
          $ffmpegVersion | Select-Object -First 1
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself and exits early.
          $deadline = (Get-Date).AddSeconds(60)
          while (((Test-Path "$dir\DoublEnder.exe") -or (Test-Path $key)) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path "$dir\DoublEnder.exe") { throw "The uninstaller left DoublEnder.exe behind" }
          if (Test-Path $key) { throw "The uninstaller left its Settings > Apps entry behind" }
          Write-Host "Uninstalled cleanly"

      # The one file a guest downloads.
      - uses: actions/upload-artifact@v7
        with:
          name: DoublEnder-windows
          path: dist/DoublEnder-Setup.exe
          if-no-files-found: error

      # DoublEnder.pdb for this exact build, never shipped to guests: what a
      # crash or hang dump from it needs to be read down to function names.
      - uses: actions/upload-artifact@v7
        with:
          name: DoublEnder-windows-symbols
          path: dist/*-symbols.zip
          if-no-files-found: error
